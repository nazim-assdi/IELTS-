services:
  - type: web
    name: ielts-hero-api
    runtime: node
    plan: free
    region: singapore
    rootDir: flutter/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
